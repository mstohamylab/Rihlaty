<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1B5E3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EVAPP">
<meta name="description" content="EVAPP · NeighCharge — Community solar EV charging & booking (Egypt)">
<title>EVAPP · NeighCharge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1B5E3A; --leaf:#2F9E5C; --amber:#F2A63A; --deep:#0E3320; --slate:#3F5148; --mist:#F5FAF7;
  --line:#DDE8E1; --mute:#7A8A81; --red:#C8453B; --redbg:#FBEDEB; --white:#fff;
  --r:16px; --tab:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E7EFEA;font-family:Inter,"Cairo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--deep);font-size:14px;-webkit-font-smoothing:antialiased}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] textarea{font-family:"Cairo",Inter,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}

/* Device shell: full-screen on phones, framed on desktop */
#app{position:relative;width:100%;height:100%;height:100dvh;background:var(--mist);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  #app{width:390px;height:min(844px,calc(100vh - 48px));border-radius:44px;border:10px solid var(--deep);box-shadow:0 30px 80px rgba(14,51,32,.28)}
}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-top:var(--sat);-webkit-overflow-scrolling:touch}
#screen.nopad{padding-top:0}
.pad{padding:16px}
.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Tab bar */
#tabbar{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sab);flex:none}
#tabbar[hidden]{display:none}
#tabbar button{flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#9AA8A0;font-size:10.5px;font-weight:500}
#tabbar button.on{color:var(--forest);font-weight:700}
#tabbar button.on svg{stroke-width:2.4}

/* Header */
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;background:var(--mist);z-index:5}
.hdr h1{font-size:18px;margin:0;flex:1;font-weight:800;letter-spacing:-.2px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--forest)}
.sub{color:var(--mute);font-size:12px}
h2.sec{font-size:11px;letter-spacing:1.2px;color:var(--leaf);font-weight:800;margin:20px 0 10px;text-transform:uppercase}
[dir=rtl] h2.sec{letter-spacing:0}

/* Cards & rows */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.chip-i{width:40px;height:40px;border-radius:50%;background:#E6F3EB;color:var(--forest);display:grid;place-items:center;flex:none}
.chip-i.amber{background:#FDF1DD;color:#B8741A}
.chip-i.red{background:var(--redbg);color:var(--red)}
.t{font-weight:700}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.amt{font-weight:700;white-space:nowrap}
.pos{color:var(--leaf)} .neg{color:var(--deep)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#E6F3EB;color:var(--forest)}
.badge.amber{background:#FDF1DD;color:#A2650F}
.badge.gray{background:#EEF2EF;color:var(--slate)}
.badge.red{background:var(--redbg);color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat svg{color:var(--forest);margin-bottom:4px}
.stat b{display:block;font-size:16px}
.stat span{font-size:11px;color:var(--mute)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;background:var(--forest);color:#fff;font-weight:700;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.amber{background:var(--amber);color:var(--deep)}
.btn.ghost{background:transparent;color:var(--forest);border:1.5px solid var(--forest)}
.btn.red{background:var(--red)}
.btn.light{background:#E6F3EB;color:var(--forest)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:36px;width:auto;padding:0 14px;font-size:13px;border-radius:10px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--slate);min-height:40px}
.pill.on{background:var(--forest);border-color:var(--forest);color:#fff}
.seg{display:flex;background:#E6EEE9;border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--slate)}
.seg button.on{background:#fff;color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Inputs */
.field{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:50px}
.field input{flex:1;border:0;outline:0;background:none;min-width:0;height:48px}
.field.dark{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff}
.field.dark input::placeholder{color:rgba(255,255,255,.55)}
.err{color:#FFB4A9;font-size:12px;min-height:16px;margin-top:6px}
textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:110px;resize:none;outline:0}

/* Onboarding */
.onb{min-height:100%;background:radial-gradient(120% 60% at 50% 0%,#1B5E3A 0%,#0E3320 70%);color:#fff;padding:calc(40px + var(--sat)) 24px calc(24px + var(--sab));display:flex;flex-direction:column}
.logo{width:84px;height:84px;border-radius:50%;background:var(--amber);display:grid;place-items:center;margin:28px auto 16px;color:var(--deep);box-shadow:0 10px 30px rgba(242,166,58,.35)}
.logo svg{width:40px;height:40px}
.onb h1{text-align:center;margin:0;font-size:28px;letter-spacing:2px}
.onb .tag{text-align:center;opacity:.8;margin:6px 0 36px}
.otp{display:flex;gap:10px;justify-content:center;direction:ltr}
.otp input{width:54px;height:60px;text-align:center;font-size:24px;font-weight:700;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;outline:0}
.link{color:var(--amber);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Map */
.mapwrap{position:absolute;inset:0}
.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
.pin .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;border:3px solid #fff;box-shadow:0 4px 12px rgba(14,51,32,.3)}
.pin .dot.host{background:var(--forest)} .pin .dot.station{background:var(--amber);color:var(--deep)} .pin .dot.van{background:#2F6FB0}
.pin .lbl{background:var(--deep);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pin.sel .dot{transform:scale(1.18);border-color:var(--amber)}
.pin.me .dot{width:18px;height:18px;background:#2F6FB0;border-width:3px;box-shadow:0 0 0 8px rgba(47,111,176,.2)}
.maptop{position:absolute;top:calc(12px + var(--sat));left:12px;right:12px;z-index:3;display:flex;flex-direction:column;gap:10px}
.maptop .field{box-shadow:0 4px 14px rgba(14,51,32,.12);border:0}
.fabs{position:absolute;inset-inline-end:12px;bottom:190px;display:flex;flex-direction:column;gap:10px;z-index:3}
.fab{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--forest);box-shadow:0 4px 14px rgba(14,51,32,.18)}
.fab.sos{background:var(--red);color:#fff;font-weight:800;font-size:12px}
.mapcard{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;box-shadow:0 8px 24px rgba(14,51,32,.18);border:0}

/* Charging ring */
.ring{width:190px;height:190px;margin:10px auto 6px;position:relative}
.ring>svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-size:40px;font-weight:800;color:var(--forest)}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}

/* Sheet / toast */
#scrim{position:absolute;inset:0;background:rgba(14,51,32,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + var(--sab));transform:translateY(105%);transition:transform .25s ease;max-height:88%;overflow-y:auto}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
#toast{position:absolute;left:50%;top:calc(76px + var(--sat));transform:translate(-50%,-12px);background:var(--deep);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.hero{background:linear-gradient(135deg,var(--forest),var(--deep));color:#fff;border-radius:20px;padding:18px}
.hero .k{font-size:11px;letter-spacing:1.2px;opacity:.75;font-weight:700;text-transform:uppercase}
.hero .big{font-size:32px;font-weight:800;margin:4px 0 12px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);border-radius:9px}
.bar.g{background:#E6EEE9}.bar.g i{background:var(--leaf)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiers div{text-align:center;padding:9px 2px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--slate)}
.tiers div.on{background:var(--amber);border-color:var(--amber);color:var(--deep)}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;background:#fff;width:100%;text-align:start}
.opt.on{border-color:var(--leaf);background:#EEF8F2}
.opt+.opt{margin-top:10px}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.opt.on .check{background:var(--leaf);border-color:var(--leaf)}
.stars{display:flex;gap:8px;justify-content:center}
.stars button{color:#D8C39B}
.stars button.on{color:var(--amber)}
.stars svg{width:34px;height:34px}
.stars button.on svg{fill:var(--amber)}
.toggle{width:50px;height:30px;border-radius:99px;background:#CBD6CF;position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--leaf)}
.toggle.on::after{inset-inline-start:23px}
.center{text-align:center}
.okicon{width:84px;height:84px;border-radius:50%;background:#E6F3EB;color:var(--forest);display:grid;place-items:center;margin:24px auto 12px}
.okicon svg{width:44px;height:44px}
.post{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.post+.post{margin-top:10px}
.post p{margin:8px 0 0;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:start;min-height:84px}
.quick b{font-size:13px}
.flag{font-size:10px;font-weight:700;color:#A2650F}
.sosbg{background:linear-gradient(#FDF0EE,#FBE3DF);min-height:100%}
.stepline{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.stepline div{display:flex;gap:10px;align-items:center}
.stepline i{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.stepline .done i{background:var(--leaf)} .stepline .cur i{background:var(--amber)}
.routeMap{height:220px;border-radius:16px;overflow:hidden;position:relative;background:#E4EEE8}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px}
.spark div{flex:1;background:#CFE7D8;border-radius:6px 6px 0 0;position:relative}
.spark div.on{background:var(--leaf)}
.spark span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:10px;background:#E6F3EB;color:var(--forest);font-size:20px;font-weight:700}
.srOnly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app" aria-live="polite">
  <div id="screen"></div>
  <nav id="tabbar" hidden></nav>
  <div id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status"></div>
</div>

function hdr(title,opts={}){

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2300)}

function render(anim){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  const sc=$('#screen');
  let html;
  if(!S.authed){html=V.onboarding();$('#tabbar').hidden=true;sc.classList.add('nopad')}
  else{
    const name=cur(); html=(V[name]||V.map)();
    sc.classList.toggle('nopad',name==='map'||name==='sos');
    const tabs=S.mode==='host'?HOST_TABS:DRIVER_TABS;
    const active=TAB_OF[name]||name;
    $('#tabbar').hidden=false;
    $('#tabbar').innerHTML=tabs.map(([k,i,lbl])=>`<button data-tab="${k}" class="${active===k?'on':''}" aria-label="${nm(lbl)}">${ic(i)}<span>${nm(lbl)}</span></button>`).join('');
  }
  sc.innerHTML=`<div class="${anim?'enter':''}" style="min-height:100%;${cur()==='map'&&S.authed?'height:100%':''}">${html}</div>`;
  if(anim) sc.scrollTop=0;

}

const A={
 back, lang(){S.lang=S.lang==='en'?'ar':'en';render()},
 demoFill(){S.nid='29801011234567';S.phone='01012345678';render()},
 onbNext(){
  const id=$('#nid').value.trim(),ph=$('#mob').value.trim();S.nid=id;S.phone=ph;
  const e=$('#onbErr');
  if(!/^\d{14}$/.test(id)) return e.textContent=L('National ID must be 14 digits','الرقم القومي يجب أن يكون ١٤ رقماً');
  if(!/^01[0125]\d{8}$/.test(ph)) return e.textContent=L('Enter a valid Egyptian mobile (01xxxxxxxxx)','أدخل رقم موبايل مصري صحيح');
  S.onbStep=2;render(true);setTimeout(()=>{const f=document.querySelector('[data-otp="0"]');f&&f.focus()},100);
 },
 onbBack(){S.onbStep=1;render(true)},
 verify(){
  const code=[...document.querySelectorAll('[data-otp]')].map(i=>i.value).join('');
  if(!/^\d{4}$/.test(code)) return $('#otpErr').textContent=L('Enter the 4-digit code','أدخل الرمز المكون من ٤ أرقام');
  S.authed=true;S.stack=['map'];render(true);toast(L('Welcome to EVAPP — identity verified','مرحباً بك في EVAPP — تم التحقق من الهوية'));
 },

 directions(){toast(L('Opening navigation…','جارٍ فتح الملاحة…'))},
 slot(el){S.slot=el.dataset.k;render()},

 price(el){S.host.price=Math.max(3,Math.min(12,S.host.price+ +el.dataset.k));HOSTS.ahmed.price=S.host.price;render()},
 bookTech(){toast(L('Technician booked · Thu 10:00 AM','تم حجز الفني · الخميس ١٠:٠٠ ص'))},
 signout(){S.authed=false;S.onbStep=1;S.mode='driver';S.stack=['map'];render(true)}
};

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='scrim') return closeSheet();
  const el=e.target.closest('[data-a],[data-go],[data-tab]'); if(!el||el.disabled) return;
  if(el.dataset.tab){closeSheet();return tab(el.dataset.tab)}
  if(el.dataset.go){closeSheet();return go(el.dataset.go)}
  const f=A[el.dataset.a]; f&&f(el);
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}
  if(e.target.id==='mq'){S.mq=e.target.value;const p=e.target.selectionStart;render();const q=$('#mq');q.focus();q.setSelectionRange(p,p)}
  if(e.target.dataset.otp!==undefined){e.target.value=e.target.value.replace(/\D/g,'');const nx=document.querySelector(`[data-otp="${+e.target.dataset.otp+1}"]`);if(e.target.value&&nx)nx.focus()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Backspace'&&e.target.dataset&&e.target.dataset.otp!==undefined&&!e.target.value){const pv=document.querySelector(`[data-otp="${+e.target.dataset.otp-1}"]`);pv&&pv.focus()}
  if(e.key==='Enter'&&!S.authed){S.onbStep===1?A.onbNext():A.verify()}
  if(e.key==='Escape')closeSheet();
});

/* ---------- Live telemetry simulation (1 s tick) ---------- */
setInterval(()=>{
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
  const s=S.session;
  if(s){
    s.t+=1; s.kw=Math.max(2.2,Math.min(3.4,s.kw+(Math.random()-.5)*.2));
    s.kwh+=s.kw/3600*60;            // demo speed: 60x real time
    s.pct=Math.min(100,24+s.kwh*1.6);
    set('sPct',n(Math.round(s.pct))+'%'); set('sTime',fmtT(s.t)+' '+L('elapsed','منقضي'));
    set('sKwh',n(s.kwh.toFixed(2))); set('sKw',n(s.kw.toFixed(1))+' kW');
    set('sCost',n(fx(s.kwh*s.price))); set('sCo2',n((s.kwh*.49).toFixed(1)));
    set('bkLive',`${n(s.kwh.toFixed(1))} kWh · ${egp(s.kwh*s.price)}`);
    const arc=document.getElementById('ringArc'); if(arc){const C=2*Math.PI*80;arc.setAttribute('stroke-dashoffset',C*(1-s.pct/100))}
    if(s.pct>=100) A.stopSess();
  }
  if(S.authed && (cur()==='host')){const h=HOSTS[S.sel];if(h.solar){h.solar=Math.max(.5,Math.min(5,h.solar+(Math.random()-.5)*.15));set('lfSolar',n(h.solar.toFixed(1))+' kW')}}
  if(S.mode==='host'){const H=S.host;H.solar=Math.max(1,Math.min(5,H.solar+(Math.random()-.5)*.15));H.shared+=.002;
    set('hSolar',n(H.solar.toFixed(1))+' kW');set('hShared',n(H.shared.toFixed(1))+' kWh')}
},1000);
setInterval(()=>{if(S.mode==='host'&&S.host.sessLeft>1){S.host.sessLeft--;const el=document.getElementById('hLeft');if(el)el.textContent=L(`${S.host.sessLeft} min left`,`متبقي ${n(S.host.sessLeft)} دقيقة`)}},60000);

render();
</script>
</body>
